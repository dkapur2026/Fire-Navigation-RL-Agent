[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberpath"
version = "0.1.0"
description = "Neuro-symbolic rescue agent that adapts when the rules of a burning house change."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "torch>=2.2", "matplotlib>=3.7"]
llm = ["anthropic>=0.34"]
bayes = ["pyro-ppl>=1.9", "torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
emberpath = "emberpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acceptance: acceptance tests for features that are not built yet (expected to xfail until then)",
    "slow: takes more than a few seconds (deselect with -m 'not slow')",
]
